- name: page
  in: query
  required: false
  description: Page number for pagination (default: 1)
  schema:
    type: integer
    default: 1
    minimum: 1
- name: limit
  in: query
  required: false
  description: Number of items per page (default: 20, max: 100)
  schema:
    type: integer
    default: 20
    minimum: 1
    maximum: 100
