type: object
required:
  - email
  - passwordHash
  - firstName
  - lastName
  - age
  - gender
  - role
  - hashedOtp
  - remainingTries
  - createdAt
properties:
  email:
    type: string
    format: email
    example: "user@healthai.org"
  passwordHash:
    type: string
    example: "$2a$10$abcdef1234567890"
  firstName:
    type: string
    example: "John"
  lastName:
    type: string
    example: "Doe"
  phoneNumber:
    type: string
    example: "+1234567890"
  age:
    type: integer
    minimum: 0
    maximum: 120
    example: 34
  gender:
    type: string
    enum: [MALE, FEMALE, OTHER, PREFER_NOT_TO_SAY]
    example: "MALE"
  role:
    $ref: '../users/UserRoleEnum.yaml'
  hashedOtp:
    type: string
    example: "$2a$10$hashedotpcode"
  remainingTries:
    type: integer
    example: 5
  createdAt:
    type: string
    format: date-time
    example: "2026-08-09T10:00:00.000Z"
