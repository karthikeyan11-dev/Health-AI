type: object
required:
  - email
  - password
  - firstName
  - lastName
properties:
  email:
    type: string
    format: email
    example: "user@healthai.org"
  password:
    type: string
    format: password
    minLength: 8
    example: "P@ssw0rd123!"
  firstName:
    type: string
    example: "John"
  lastName:
    type: string
    example: "Doe"
  phoneNumber:
    type: string
    example: "+1234567890"
  role:
    type: string
    enum: [PATIENT, CLINICIAN, ADMIN]
    default: PATIENT
