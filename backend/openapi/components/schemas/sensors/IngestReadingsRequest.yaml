type: object
required:
  - deviceId
  - userId
  - readings
properties:
  deviceId:
    type: string
    example: "ESP32-HEALTH-001"
  userId:
    type: string
    example: "64f1a2b3c4d5e6f7a8b9c0d1"
  readings:
    type: array
    items:
      type: object
      required:
        - sensorType
        - value
        - unit
      properties:
        sensorType:
          $ref: './SensorTypeEnum.yaml'
        value:
          type: number
          example: 72.0
        unit:
          type: string
          example: "bpm"
        timestamp:
          type: string
          format: date-time
          example: "2026-08-07T09:00:00.000Z"
