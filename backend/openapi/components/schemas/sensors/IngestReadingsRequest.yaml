type: object
required:
  - readings
properties:
  deviceId:
    type: string
    example: "WATCH_HEALTH_AI_PRO_01"
  userId:
    type: string
    example: "6aa63692d48b7752f16803d2"
  batteryLevel:
    type: number
    minimum: 0
    maximum: 100
    example: 94
  readings:
    type: array
    items:
      type: object
      required:
        - sensorType
        - value
      properties:
        sensorType:
          $ref: './SensorTypeEnum.yaml'
        value:
          type: number
          example: 72.0
        unit:
          type: string
          example: "bpm"
        confidence:
          type: number
          minimum: 0
          maximum: 100
          example: 98.5
        timestamp:
          type: string
          format: date-time
          example: "2026-09-13T09:00:00.000Z"
        metadata:
          type: object
          additionalProperties: true
