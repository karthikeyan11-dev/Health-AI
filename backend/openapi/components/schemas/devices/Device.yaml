type: object
required:
  - id
  - deviceId
  - macAddress
  - deviceType
  - status
  - userId
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    example: "64f1a2b3c4d5e6f7a8b9c0d2"
  deviceId:
    type: string
    example: "ESP32-HEALTH-001"
  macAddress:
    type: string
    example: "A4:CF:12:89:56:AB"
  deviceType:
    type: string
    example: "ESP32-MULTI-SENSOR"
  firmwareVersion:
    type: string
    example: "v1.2.4"
  status:
    $ref: './DeviceStatusEnum.yaml'
  userId:
    type: string
    example: "64f1a2b3c4d5e6f7a8b9c0d1"
  lastSeenAt:
    type: string
    format: date-time
    example: "2026-08-07T08:59:30.000Z"
  createdAt:
    type: string
    format: date-time
    example: "2026-08-07T09:00:00.000Z"
  updatedAt:
    type: string
    format: date-time
    example: "2026-08-07T09:00:00.000Z"
