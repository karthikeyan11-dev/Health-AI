type: object
required:
  - success
  - message
  - data
  - meta
properties:
  success:
    type: boolean
    example: true
  message:
    type: string
    example: "Cardiovascular risk history retrieved successfully"
  data:
    type: array
    items:
      type: object
      required:
        - riskScore
        - riskLevel
        - timestamp
      properties:
        riskScore:
          type: number
          example: 18.5
        riskLevel:
          $ref: './CardiovascularRiskEnum.yaml'
        timestamp:
          type: string
          format: date-time
          example: "2026-08-07T09:00:00.000Z"
  meta:
    $ref: '../common/Metadata.yaml'
