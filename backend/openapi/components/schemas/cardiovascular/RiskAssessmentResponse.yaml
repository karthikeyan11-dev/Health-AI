type: object
required:
  - success
  - message
  - data
  - meta
properties:
  success:
    type: boolean
    example: true
  message:
    type: string
    example: "Cardiovascular risk assessment completed"
  data:
    type: object
    required:
      - userId
      - riskScore
      - riskLevel
      - recommendations
      - timestamp
    properties:
      userId:
        type: string
        example: "64f1a2b3c4d5e6f7a8b9c0d1"
      riskScore:
        type: number
        minimum: 0
        maximum: 100
        example: 18.5
      riskLevel:
        $ref: './CardiovascularRiskEnum.yaml'
      contributingFactors:
        type: array
        items:
          type: string
        example:
          - "Elevated heart rate"
          - "Subtle SpO2 drop"
      topDrivers:
        type: array
        items:
          type: object
          required:
            - feature
            - value
            - impact
          properties:
            feature:
              type: string
              example: "bp_systolic"
            value:
              type: number
              example: 160.0
            impact:
              type: number
              example: 0.205
      probabilities:
        type: object
        additionalProperties:
          type: number
        example:
          OPTIMAL: 0.012
          LOW: 0.854
          MODERATE: 0.098
          HIGH: 0.024
          CRITICAL: 0.012
      confidence:
        type: number
        minimum: 0
        maximum: 100
        example: 94.0
      explanation:
        type: string
        example: "Risk assessment calculated from continuous physiological telemetry and lifestyle indicators."
      recommendations:
        type: array
        items:
          type: string
        example:
          - "Maintain steady hydration"
          - "Engage in 30 mins moderate aerobic activity daily"
      recommendedIntervention:
        type: string
        example: "Diet & Nutrition Intervention"
      guidance:
        type: object
        required:
          - status
          - provider
          - message
        properties:
          status:
            type: string
            example: "success"
          provider:
            type: string
            example: "gemini"
          message:
            type: string
            example: "Your cardiovascular vitals look strong today. Keep up your active walking routine and healthy hydration."
      timestamp:
        type: string
        format: date-time
        example: "2026-08-07T09:00:00.000Z"
  meta:
    $ref: '../common/Metadata.yaml'
