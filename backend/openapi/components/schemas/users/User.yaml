type: object
required:
  - id
  - email
  - firstName
  - lastName
  - age
  - gender
  - role
  - isActive
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    example: "64f1a2b3c4d5e6f7a8b9c0d1"
  email:
    type: string
    format: email
    example: "john.doe@healthai.org"
  firstName:
    type: string
    example: "John"
  lastName:
    type: string
    example: "Doe"
  phoneNumber:
    type: string
    example: "+1234567890"
  age:
    type: integer
    minimum: 0
    maximum: 120
    example: 34
  gender:
    type: string
    enum: [MALE, FEMALE, OTHER, PREFER_NOT_TO_SAY]
    example: "MALE"
  role:
    $ref: './UserRoleEnum.yaml'
  isEmailVerified:
    type: boolean
    example: true
  isPhoneVerified:
    type: boolean
    example: false
  isActive:
    type: boolean
    example: true
  dateOfBirth:
    type: string
    format: date
    example: "1990-05-15"
  lastLoginAt:
    type: string
    format: date-time
    example: "2026-08-09T10:00:00.000Z"
  createdAt:
    type: string
    format: date-time
    example: "2026-08-07T09:00:00.000Z"
  updatedAt:
    type: string
    format: date-time
    example: "2026-08-07T09:00:00.000Z"

  # Optional patient-specific health fields (populated when user role is PATIENT)
  healthStatus:
    type: string
    example: "STABLE"
    description: "Overall physiological health state indicator for patient"
  primaryPhysician:
    type: string
    example: "Dr. Sarah Jenkins"
    description: "Assigned primary healthcare practitioner name"
  connectedDevicesCount:
    type: integer
    example: 2
    description: "Count of actively paired IoT medical devices"
  activeMonitoringStreams:
    type: integer
    example: 1
    description: "Count of active real-time telemetry sensor streams"
  recentHeartRateBpm:
    type: number
    example: 72
    description: "Latest average heart rate in BPM"
  recentSpo2Percent:
    type: number
    example: 98.5
    description: "Latest blood oxygen saturation percentage"
  recentTemperatureCelsius:
    type: number
    example: 36.6
    description: "Latest body temperature in degrees Celsius"
  riskAssessmentScore:
    type: string
    example: "LOW_RISK"
    description: "AI evaluated cardiovascular and stress risk level"
  medicalNotes:
    type: string
    example: "Patient telemetry within physiological baseline."

