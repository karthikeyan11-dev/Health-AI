type: object
required:
  - email
  - password
  - firstName
  - lastName
  - role
properties:
  email:
    type: string
    format: email
    example: "john.doe@healthai.org"
  password:
    type: string
    format: password
    minLength: 8
    example: "P@ssw0rd123!"
  firstName:
    type: string
    example: "John"
  lastName:
    type: string
    example: "Doe"
  phoneNumber:
    type: string
    example: "+1234567890"
  role:
    $ref: './UserRoleEnum.yaml'
  dateOfBirth:
    type: string
    format: date
    example: "1990-05-15"
  gender:
    type: string
    enum: [MALE, FEMALE, OTHER, PREFER_NOT_TO_SAY]
    example: "MALE"
