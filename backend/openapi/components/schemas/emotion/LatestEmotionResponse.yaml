type: object
required:
  - success
  - message
  - data
  - meta
properties:
  success:
    type: boolean
    example: true
  message:
    type: string
    example: "Latest emotion state retrieved successfully"
  data:
    type: object
    required:
      - userId
      - emotion
      - confidence
      - timestamp
    properties:
      userId:
        type: string
        example: "64f1a2b3c4d5e6f7a8b9c0d1"
      emotion:
        $ref: './EmotionEnum.yaml'
      confidence:
        type: number
        example: 0.94
      timestamp:
        type: string
        format: date-time
        example: "2026-08-07T09:00:00.000Z"
  meta:
    $ref: '../common/Metadata.yaml'
