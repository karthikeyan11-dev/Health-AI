type: object
required:
  - success
  - error
  - meta
properties:
  success:
    type: boolean
    example: false
    description: Indicates that the operation failed
  error:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: string
        example: INVALID_INPUT
        description: Machine-readable error code
      message:
        type: string
        example: The provided request payload contains invalid fields.
        description: Human-readable error message
      details:
        type: array
        items:
          $ref: './ValidationError.yaml'
        description: Field-level validation error details, if applicable
  meta:
    $ref: './Metadata.yaml'
