type: object
required:
  - createdAt
  - updatedAt
properties:
  createdAt:
    type: string
    format: date-time
    example: "2026-08-07T09:00:00.000Z"
    description: ISO 8601 creation timestamp
  updatedAt:
    type: string
    format: date-time
    example: "2026-08-07T09:00:00.000Z"
    description: ISO 8601 last update timestamp
