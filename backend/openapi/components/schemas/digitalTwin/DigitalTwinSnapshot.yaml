type: object
required:
  - id
  - userId
  - digitalTwinId
  - overallHealthScore
  - healthState
  - triggerReason
  - version
  - timestamp
  - createdAt
properties:
  id:
    type: string
    example: "64f1a2b3c4d5e6f7a8b9c0d9"
  userId:
    type: string
    example: "64f1a2b3c4d5e6f7a8b9c0d1"
  patientId:
    type: string
    example: "64f1a2b3c4d5e6f7a8b9c0d2"
  digitalTwinId:
    type: string
    example: "64f1a2b3c4d5e6f7a8b9c0d5"
  overallHealthScore:
    type: number
    minimum: 0
    maximum: 100
    example: 84.5
  healthState:
    $ref: './TwinHealthStateEnum.yaml'
  heartRate:
    type: number
    example: 72.0
  spO2:
    type: number
    example: 98.5
  temperature:
    type: number
    example: 36.6
  dominantEmotion:
    $ref: '../emotion/EmotionEnum.yaml'
  stressScore:
    type: number
    example: 24.0
  cardioRiskScore:
    type: number
    example: 14.5
  confidence:
    type: number
    minimum: 0
    maximum: 100
    example: 92.0
  triggerReason:
    $ref: './SnapshotTriggerReasonEnum.yaml'
  version:
    type: integer
    minimum: 1
    example: 3
  timestamp:
    type: string
    format: date-time
    example: "2026-09-12T08:00:00.000Z"
  createdAt:
    type: string
    format: date-time
    example: "2026-09-12T08:00:00.000Z"
