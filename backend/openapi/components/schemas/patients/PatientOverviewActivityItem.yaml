type: object
required:
  - id
  - type
  - title
  - description
  - timestamp
properties:
  id:
    type: string
    example: "act_101"
  type:
    type: string
    example: "ASSESSMENT"
  title:
    type: string
    example: "Cardiovascular Risk Assessment Completed"
  description:
    type: string
    example: "Risk score evaluated as LOW risk based on latest vitals."
  timestamp:
    type: string
    example: "2026-08-14T10:30:00.000Z"
