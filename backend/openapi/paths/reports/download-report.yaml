get:
  tags:
    - Health Reports
  summary: Download report document
  description: Downloads the generated PDF or JSON report artifact.
  operationId: downloadReport
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Report document stream
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        application/json:
          schema:
            type: object
    '404':
      description: Report file not found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/ErrorResponse.yaml'
