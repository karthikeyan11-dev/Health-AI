get:
  tags:
    - Cardiovascular Risk Assessment
  summary: Get cardiovascular risk assessment history
  description: Returns historical risk assessment records over time.
  operationId: getCardiovascularRiskHistory
  security:
    - BearerAuth: []
  parameters:
    - name: userId
      in: query
      required: true
      schema:
        type: string
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
  responses:
    '200':
      description: Cardiovascular risk history retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/cardiovascular/RiskHistoryResponse.yaml'
