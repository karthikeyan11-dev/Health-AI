post:
  tags:
    - Sensors
  summary: Ingest telemetry readings from ESP32 sensors
  description: Receives batch vital sign telemetry (Heart Rate, SpO2, Temperature) from ESP32 microcontrollers.
  operationId: ingestSensorReadings
  security:
    - ApiKeyAuth: []
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/sensors/IngestReadingsRequest.yaml'
  responses:
    '202':
      description: Sensor telemetry accepted for processing
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/SuccessResponse.yaml'
    '400':
      description: Invalid sensor telemetry format
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/ErrorResponse.yaml'
