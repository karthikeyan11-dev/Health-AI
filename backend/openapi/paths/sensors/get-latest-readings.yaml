get:
  tags:
    - Sensors
  summary: Get latest sensor readings
  description: Fetches the most recent vital signs reading snapshot for a given user or device.
  operationId: getLatestSensorReadings
  security:
    - BearerAuth: []
  parameters:
    - name: userId
      in: query
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Latest sensor readings retrieved
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/sensors/LatestReadingsResponse.yaml'
    '404':
      description: No readings found for user
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/ErrorResponse.yaml'
