post:
  tags:
    - Authentication
  summary: Authenticate user and obtain tokens
  description: Authenticates user credentials and returns JWT access and refresh token pair.
  operationId: loginUser
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth/LoginRequest.yaml'
  responses:
    '200':
      description: Authentication successful
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/auth/AuthTokensResponse.yaml'
    '401':
      description: Invalid credentials
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/ErrorResponse.yaml'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/ErrorResponse.yaml'
