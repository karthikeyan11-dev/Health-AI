post:
  tags:
    - Authentication
  summary: Request password reset link
  description: Triggers a password reset token email to the user.
  operationId: forgotPassword
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth/ForgotPasswordRequest.yaml'
  responses:
    '200':
      description: Password reset link sent if account exists
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/SuccessResponse.yaml'
    '400':
      description: Invalid email format
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/ErrorResponse.yaml'
