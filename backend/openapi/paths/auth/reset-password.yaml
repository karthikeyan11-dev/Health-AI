post:
  tags:
    - Authentication
  summary: Reset password using token
  description: Resets user password using the provided reset token.
  operationId: resetPassword
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth/ResetPasswordRequest.yaml'
  responses:
    '200':
      description: Password reset successfully
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/SuccessResponse.yaml'
    '400':
      description: Invalid or expired reset token
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/ErrorResponse.yaml'
