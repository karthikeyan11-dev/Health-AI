post:
  tags:
    - Authentication
  summary: Verify email OTP and complete user registration
  description: Verifies the 6-digit email OTP for pending registration and creates the permanent user account.
  operationId: verifyOtp
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth/VerifyOtpRequest.yaml'
  responses:
    '200':
      description: OTP verified successfully and user account created
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/SuccessResponse.yaml'
    '400':
      description: Invalid OTP, expired OTP, or validation error
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/ErrorResponse.yaml'
    '429':
      description: Maximum OTP verification attempts exceeded
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/ErrorResponse.yaml'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/ErrorResponse.yaml'
