put:
  tags:
    - Authentication
  summary: Change authenticated user password
  description: Updates current user password after validating existing credentials.
  operationId: changePassword
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth/ChangePasswordRequest.yaml'
  responses:
    '200':
      description: Password changed successfully
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/SuccessResponse.yaml'
    '400':
      description: Invalid current password or weak new password
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/ErrorResponse.yaml'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/ErrorResponse.yaml'
