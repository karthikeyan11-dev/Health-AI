get:
  tags:
    - Emotion AI Service
  summary: Get emotion detection history logs
  description: Retrieves historical facial emotion logs for trend analysis.
  operationId: getEmotionLogs
  security:
    - BearerAuth: []
  parameters:
    - name: userId
      in: query
      required: true
      schema:
        type: string
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
  responses:
    '200':
      description: Emotion logs retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/emotion/EmotionLogResponse.yaml'
