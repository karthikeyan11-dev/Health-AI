get:
  tags:
    - Digital Twin
  summary: Get Digital Twin immutable evolution snapshots
  description: Returns paginated historical evolution snapshots of the patient's Digital Twin for auditing and state reconstruction.
  operationId: getDigitalTwinSnapshots
  security:
    - BearerAuth: []
  parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
    - name: startDate
      in: query
      required: false
      schema:
        type: string
        format: date-time
    - name: endDate
      in: query
      required: false
      schema:
        type: string
        format: date-time
    - name: trigger
      in: query
      required: false
      schema:
        $ref: '../../components/schemas/digitalTwin/SnapshotTriggerReasonEnum.yaml'
  responses:
    '200':
      description: Digital Twin snapshots retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/digitalTwin/DigitalTwinSnapshotListResponse.yaml'
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/ErrorResponse.yaml'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/ErrorResponse.yaml'
    '404':
      description: Digital Twin not found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/ErrorResponse.yaml'
