components:
  schemas:
    UserRoleEnum:
      type: string
      enum:
        - PATIENT
        - SYSTEM
      example: PATIENT
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
        - age
        - gender
      properties:
        email:
          type: string
          format: email
          example: user@healthai.org
        password:
          type: string
          format: password
          minLength: 8
          example: P@ssw0rd123!
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        phoneNumber:
          type: string
          example: '+1234567890'
        age:
          type: integer
          minimum: 0
          maximum: 120
          example: 34
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
            - PREFER_NOT_TO_SAY
          example: MALE
        role:
          $ref: '#/components/schemas/UserRoleEnum'
    Pagination:
      type: object
      required:
        - page
        - limit
        - totalItems
        - totalPages
        - hasNextPage
        - hasPrevPage
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
          description: Current page number (1-indexed)
        limit:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
          description: Number of items per page
        totalItems:
          type: integer
          minimum: 0
          example: 150
          description: Total number of items available
        totalPages:
          type: integer
          minimum: 0
          example: 8
          description: Total number of pages
        hasNextPage:
          type: boolean
          example: true
          description: Indicates whether a next page exists
        hasPrevPage:
          type: boolean
          example: false
          description: Indicates whether a previous page exists
    Metadata:
      type: object
      required:
        - timestamp
        - requestId
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-08-07T09:00:00.000Z'
          description: System timestamp when response was generated
        requestId:
          type: string
          example: req_99b1a8f2
          description: Unique correlation ID for tracking request lifecycle
        pagination:
          $ref: '#/components/schemas/Pagination'
    RegisterResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
          description: Indicates that the registration request succeeded
        message:
          type: string
          example: OTP verification code sent to your email
          description: Human-readable status message
        data:
          type: object
          required:
            - email
          properties:
            email:
              type: string
              format: email
              example: user@healthai.org
            expiresInSeconds:
              type: integer
              example: 300
              description: Time-to-live for the OTP code in seconds
        meta:
          $ref: '#/components/schemas/Metadata'
    ValidationError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: email
          description: Target field or path where validation failed
        message:
          type: string
          example: Must be a valid email address
          description: Human-readable validation failure reason
        value:
          type: string
          nullable: true
          example: invalid-email
          description: Invalid input value provided
    ErrorResponse:
      type: object
      required:
        - success
        - error
        - meta
      properties:
        success:
          type: boolean
          example: false
          description: Indicates that the operation failed
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: INVALID_INPUT
              description: Machine-readable error code
            message:
              type: string
              example: The provided request payload contains invalid fields.
              description: Human-readable error message
            details:
              type: array
              items:
                $ref: '#/components/schemas/ValidationError'
              description: Field-level validation error details, if applicable
        meta:
          $ref: '#/components/schemas/Metadata'
    VerifyOtpRequest:
      type: object
      required:
        - email
        - otp
      properties:
        email:
          type: string
          format: email
          example: user@healthai.org
          description: Email address used during registration
        otp:
          type: string
          minLength: 6
          maxLength: 6
          example: '123456'
          description: 6-digit numeric verification code
    SuccessResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
          description: Indicates that the request succeeded
        message:
          type: string
          example: Operation completed successfully
          description: Human-readable success message
        meta:
          $ref: '#/components/schemas/Metadata'
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@healthai.org
        password:
          type: string
          format: password
          example: P@ssw0rd123!
    AuthTokensResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
      properties:
