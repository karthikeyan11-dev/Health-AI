openapi: 3.0.3
info:
  title: Health AI - Smart Healthcare Monitoring Platform API
  description: |
    Production-grade OpenAPI 3.0.3 specification for the Health AI platform backend architecture. Provides RESTful endpoints for IoT sensor telemetry ingestion (ESP32), computer vision facial emotion recognition, Digital Twin physiological state modelling, real-time stress assessment, cardiovascular risk evaluation, AI chatbot interaction, automated clinical recommendations, and notification services.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Health AI Engineering Team
    email: dev@healthai.org
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Node.js Gateway Backend
  - url: https://api.healthai.org/api/v1
    description: Production Gateway Endpoint
security:
  - BearerAuth: []
  - ApiKeyAuth: []
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user account
      description: Registers a new patient account into the Health AI platform.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Validation error or duplicate email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/verify-otp:
    post:
      tags:
        - Authentication
      summary: Verify email OTP and complete user registration
      description: Verifies the 6-digit email OTP for pending registration and creates the permanent user account.
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: OTP verified successfully and user account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid OTP, expired OTP, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Maximum OTP verification attempts exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user and obtain tokens
      description: Authenticates user credentials and returns JWT access and refresh token pair.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh-token:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Exchanges a valid refresh token for a new JWT access and refresh token pair.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Invalidates active refresh token and revokes access session.
      operationId: logoutUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset link
      description: Triggers a password reset token email to the user.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Password reset link sent if account exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid email format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password using token
      description: Resets user password using the provided reset token.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid or expired reset token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/profile:
    get:
      tags:
        - Authentication
      summary: Get current authenticated user profile
      description: Returns profile details for the currently authenticated JWT user.
      operationId: getProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/change-password:
    put:
      tags:
        - Authentication
      summary: Change authenticated user password
      description: Updates current user password after validating existing credentials.
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid current password or weak new password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users:
    get:
      tags:
        - Users
      summary: List all users
      description: Fetches a paginated list of users filtered optionally by role or active status.
      operationId: getUsers
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserRoleEnum'
      responses:
        '200':
          description: Users list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Users
      summary: Create user
      description: Creates a new user record in the system with specified role and credentials.
      operationId: createUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{userId}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Fetches detailed information for a specific user ID.
      operationId: getUserById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Users
      summary: Update user details
      description: Updates profile attributes for a specific user.
      operationId: updateUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Users
      summary: Soft delete user
      description: Deactivates or soft-deletes a user profile in the platform.
      operationId: deleteUser
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User deleted/deactivated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /devices:
    get:
      tags:
        - Devices
      summary: List all registered devices
      description: Fetches all registered ESP32 sensor hardware devices.
      operationId: getDevices
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Device list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Devices
      summary: Register hardware device (ESP32)
      description: Registers a physical ESP32 multi-sensor device and pairs it with a patient user.
      operationId: registerDevice
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          description: Invalid MAC address or device payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /devices/{id}:
    get:
      tags:
        - Devices
      summary: Get device by ID
      description: Fetches metadata for a specific registered device.
      operationId: getDeviceById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Devices
      summary: Update device metadata
      description: Updates device status, assigned user, or firmware version.
      operationId: updateDevice
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
      responses:
        '200':
          description: Device updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Devices
      summary: Unregister device
      description: Removes device registration from system registry.
      operationId: deleteDevice
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device unregistered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /devices/{id}/status:
    get:
      tags:
        - Devices
      summary: Get device operational status
      description: Returns real-time connectivity status, last seen timestamp, uptime, and battery telemetry for the device.
      operationId: getDeviceStatus
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusResponse'
        '404':
          description: Device not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sensors/readings:
    post:
      tags:
        - Sensors
      summary: Ingest telemetry readings from ESP32 sensors
      description: Receives batch vital sign telemetry (Heart Rate, SpO2, Temperature) from ESP32 microcontrollers.
      operationId: ingestSensorReadings
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestReadingsRequest'
      responses:
        '202':
          description: Sensor telemetry accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid sensor telemetry format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sensors/readings/latest:
    get:
      tags:
        - Sensors
      summary: Get latest sensor readings
      description: Fetches the most recent vital signs reading snapshot for a given user or device.
      operationId: getLatestSensorReadings
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Latest sensor readings retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestReadingsResponse'
        '404':
          description: No readings found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sensors/readings/history:
    get:
      tags:
        - Sensors
      summary: Get historical sensor telemetry
      description: Returns time-series sensor telemetry data for analytics and charts.
      operationId: getHistoricalSensorReadings
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: sensorType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SensorTypeEnum'
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Historical sensor readings retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalReadingsResponse'
  /sensors/heart-rate:
    get:
      tags:
        - Sensors
      summary: Get current heart rate telemetry
      description: Returns latest heart rate reading (BPM) and classification status.
      operationId: getHeartRate
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Heart rate data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/HeartRateData'
  /sensors/temperature:
    get:
      tags:
        - Sensors
      summary: Get current body temperature telemetry
      description: Returns latest body temperature in Celsius and Fahrenheit with clinical threshold analysis.
      operationId: getTemperature
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Temperature data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TemperatureData'
  /sensors/spo2:
    get:
      tags:
        - Sensors
      summary: Get current SpO2 blood oxygen telemetry
      description: Returns latest SpO2 percentage reading and oxygenation status.
      operationId: getSpO2
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SpO2 data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SpO2Data'
  /emotion/predict:
    post:
      tags:
        - Emotion AI Service
      summary: Predict facial emotion from image frame
      description: Proxy endpoint that routes image payload to the Python AI Microservice (`emotion_detection`) for CNN inference.
      operationId: predictEmotion
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictEmotionRequest'
      responses:
        '200':
          description: Facial emotion predicted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictEmotionResponse'
        '400':
          description: Invalid image payload or unreadable image frame
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Emotion AI Microservice unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /emotion/logs:
    get:
      tags:
        - Emotion AI Service
      summary: Get emotion detection history logs
      description: Retrieves historical facial emotion logs for trend analysis.
      operationId: getEmotionLogs
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Emotion logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmotionLogResponse'
  /emotion/latest:
    get:
      tags:
        - Emotion AI Service
      summary: Get latest emotion state
      description: Returns current emotional state classification for a user.
      operationId: getLatestEmotion
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Latest emotion retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestEmotionResponse'
  /digital-twin:
    post:
      tags:
        - Digital Twin
      summary: Initialize Digital Twin instance for user
      description: Initializes a computational Digital Twin profile representing physiological and emotional state baselines.
      operationId: createDigitalTwin
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTwinRequest'
      responses:
        '201':
          description: Digital Twin initialized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalTwinResponse'
        '400':
          description: Twin already exists or invalid configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /digital-twin/{userId}:
    get:
      tags:
        - Digital Twin
      summary: Get Digital Twin profile
      description: Fetches full Digital Twin profile state including physiological baselines and health scores.
      operationId: getDigitalTwin
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Digital Twin retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalTwinResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Digital Twin not found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Digital Twin
      summary: Update Digital Twin baselines
      description: Updates baseline vital sign thresholds and baseline emotion models in the Digital Twin.
      operationId: updateDigitalTwin
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTwinRequest'
      responses:
        '200':
          description: Digital Twin updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalTwinResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Digital Twin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /digital-twin/{userId}/state:
    get:
      tags:
        - Digital Twin
      summary: Get real-time health state of Digital Twin
      description: Computes real-time snapshot of user's current health score, active stress score, and risk status.
      operationId: getCurrentTwinState
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current health state calculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalTwinResponse'
  /digital-twin/{userId}/history:
    get:
      tags:
