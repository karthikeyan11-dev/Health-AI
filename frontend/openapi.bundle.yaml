    PatientOverviewVitals:
      type: object
      properties:
        heartRateBpm:
          type: number
          nullable: true
          example: 72
        spo2Percent:
          type: number
          nullable: true
          example: 98.5
        temperatureCelsius:
          type: number
          nullable: true
          example: 36.6
        timestamp:
          type: string
          nullable: true
          example: '2026-08-14T10:30:00.000Z'
    PatientOverviewCardioRisk:
      type: object
      required:
        - riskLevel
      properties:
        riskScore:
          type: number
          nullable: true
          example: 18.5
        riskLevel:
          type: string
          example: LOW
        timestamp:
          type: string
          nullable: true
          example: '2026-08-14T09:00:00.000Z'
    PatientOverviewStress:
      type: object
      required:
        - stressLevel
      properties:
        stressScore:
          type: number
          nullable: true
          example: 22
        stressLevel:
          type: string
          example: LOW
        timestamp:
          type: string
          nullable: true
          example: '2026-08-14T09:00:00.000Z'
    PatientOverviewDigitalTwin:
      type: object
      required:
        - healthState
      properties:
        overallHealthScore:
          type: number
          nullable: true
          example: 92.5
        healthState:
          type: string
          example: STABLE
        lastUpdated:
          type: string
          nullable: true
          example: '2026-08-14T10:30:00.000Z'
    PatientVitalTrendPoint:
      type: object
      required:
        - timestamp
      properties:
        timestamp:
          type: string
          example: '10:00'
        heartRate:
          type: number
          nullable: true
          example: 72
        spo2:
          type: number
          nullable: true
          example: 98.5
        temperature:
          type: number
          nullable: true
          example: 36.6
    PatientHealthRiskSummary:
      type: object
      required:
        - optimalPercent
        - stablePercent
        - elevatedPercent
        - atRiskPercent
      properties:
        optimalPercent:
          type: number
          example: 70
        stablePercent:
          type: number
          example: 20
        elevatedPercent:
          type: number
          example: 8
        atRiskPercent:
          type: number
          example: 2
    PatientOverviewActivityItem:
      type: object
      required:
        - id
        - type
        - title
        - description
        - timestamp
      properties:
        id:
          type: string
          example: act_101
        type:
          type: string
          example: ASSESSMENT
        title:
          type: string
          example: Cardiovascular Risk Assessment Completed
        description:
          type: string
          example: Risk score evaluated as LOW risk based on latest vitals.
        timestamp:
          type: string
          example: '2026-08-14T10:30:00.000Z'
    PatientOverviewData:
      type: object
      required:
        - patientInfo
        - deviceInfo
        - latestVitals
        - latestCardiovascularRisk
        - latestStressAssessment
        - digitalTwinState
        - recentRecommendations
        - vitalSignTrend
        - healthRiskSummary
        - recentActivity
      properties:
        patientInfo:
          $ref: '#/components/schemas/PatientOverviewInfo'
        deviceInfo:
          $ref: '#/components/schemas/PatientOverviewDeviceInfo'
        latestVitals:
          $ref: '#/components/schemas/PatientOverviewVitals'
        latestCardiovascularRisk:
          $ref: '#/components/schemas/PatientOverviewCardioRisk'
        latestStressAssessment:
          $ref: '#/components/schemas/PatientOverviewStress'
        digitalTwinState:
          $ref: '#/components/schemas/PatientOverviewDigitalTwin'
        recentRecommendations:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
        vitalSignTrend:
          type: array
          items:
            $ref: '#/components/schemas/PatientVitalTrendPoint'
        healthRiskSummary:
          $ref: '#/components/schemas/PatientHealthRiskSummary'
        recentActivity:
          type: array
          items:
            $ref: '#/components/schemas/PatientOverviewActivityItem'
    PatientOverviewResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Patient health overview retrieved successfully
        data:
          $ref: '#/components/schemas/PatientOverviewData'
        meta:
          $ref: '#/components/schemas/Metadata'
    HealthMonitoringData:
      type: object
      required:
        - currentReadings
        - devices
        - heartRateHistory
        - spo2History
        - temperatureHistory
        - combinedVitalTrends
      properties:
        currentReadings:
          type: object
          required:
            - heartRate
            - spo2
            - temperature
          properties:
            heartRate:
              type: object
              nullable: true
              properties:
                value:
                  type: number
                unit:
                  type: string
                timestamp:
                  type: string
                  format: date-time
                deviceId:
                  type: string
            spo2:
              type: object
              nullable: true
              properties:
                value:
                  type: number
                unit:
                  type: string
                timestamp:
                  type: string
                  format: date-time
                deviceId:
                  type: string
            temperature:
              type: object
              nullable: true
              properties:
                value:
                  type: number
                unit:
                  type: string
                timestamp:
                  type: string
                  format: date-time
                deviceId:
                  type: string
        devices:
          type: array
          items:
            type: object
            required:
              - deviceId
              - status
            properties:
              deviceId:
                type: string
              name:
                type: string
              status:
                type: string
              lastSeenAt:
                type: string
                format: date-time
        heartRateHistory:
          type: array
          items:
            type: object
            required:
              - timestamp
              - value
            properties:
              timestamp:
                type: string
                format: date-time
              value:
                type: number
              deviceId:
                type: string
        spo2History:
          type: array
          items:
            type: object
            required:
              - timestamp
              - value
            properties:
              timestamp:
                type: string
                format: date-time
              value:
                type: number
              deviceId:
                type: string
        temperatureHistory:
          type: array
          items:
            type: object
            required:
              - timestamp
              - value
            properties:
              timestamp:
                type: string
                format: date-time
              value:
                type: number
              deviceId:
                type: string
        combinedVitalTrends:
          type: array
          items:
            type: object
            required:
              - timestamp
            properties:
              timestamp:
                type: string
                format: date-time
              heartRate:
                type: number
                nullable: true
              spo2:
                type: number
                nullable: true
              temperature:
                type: number
                nullable: true
              deviceId:
                type: string
    HealthMonitoringResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Health monitoring data retrieved successfully
        data:
          $ref: '#/components/schemas/HealthMonitoringData'
        meta:
          $ref: '#/components/schemas/Metadata'
    Timestamp:
      type: object
      required:
        - createdAt
        - updatedAt
      properties:
        createdAt:
          type: string
          format: date-time
          example: '2026-08-07T09:00:00.000Z'
          description: ISO 8601 creation timestamp
        updatedAt:
          type: string
          format: date-time
          example: '2026-08-07T09:00:00.000Z'
          description: ISO 8601 last update timestamp
    BaseEntity:
      type: object
      required:
        - id
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          example: 64f1a2b3c4d5e6f7a8b9c0d1
          description: Unique 24-character hexadecimal MongoDB ObjectId identifier
        createdAt:
          type: string
          format: date-time
          example: '2026-08-07T09:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-08-07T09:00:00.000Z'
    ApiResponse:
      type: object
      required:
        - success
        - message
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Action completed successfully
        data:
          type: object
          nullable: true
        meta:
          $ref: '#/components/schemas/Metadata'
    PendingRegistrationData:
      type: object
      required:
        - email
        - passwordHash
        - firstName
        - lastName
        - age
        - gender
        - role
        - hashedOtp
        - remainingTries
        - createdAt
      properties:
        email:
          type: string
          format: email
          example: user@healthai.org
        passwordHash:
          type: string
          example: $2a$10$abcdef1234567890
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        phoneNumber:
          type: string
          example: '+1234567890'
        age:
          type: integer
          minimum: 0
          maximum: 120
          example: 34
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
            - PREFER_NOT_TO_SAY
          example: MALE
        role:
          $ref: '#/components/schemas/UserRoleEnum'
        hashedOtp:
          type: string
          example: $2a$10$hashedotpcode
        remainingTries:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time
          example: '2026-08-09T10:00:00.000Z'
    StoredOtpRecord:
      type: object
      required:
        - hashedOtp
        - email
        - remainingTries
        - createdAt
      properties:
        hashedOtp:
          type: string
          example: $2a$10$hashedotpcode
        email:
          type: string
          format: email
          example: user@healthai.org
        remainingTries:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time
          example: '2026-08-09T10:00:00.000Z'
  parameters:
    UserIdParam:
      name: userId
      in: path
      required: true
      description: Unique 24-character MongoDB ObjectId identifier of the user
      schema:
        type: string
        example: 64f1a2b3c4d5e6f7a8b9c0d1
    DeviceIdParam:
      name: id
      in: path
      required: true
      description: Unique identifier of the device
      schema:
        type: string
        example: 64f1a2b3c4d5e6f7a8b9c0d2
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT Bearer token in format 'Bearer <token>'
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: API Key authentication header for ESP32 hardware devices and AI microservices
